name: Synthetic lab
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lab*.txt
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-lab-dev.txt
      - run: .venv/bin/ruff check playground tests
      - run: .venv/bin/python -m unittest discover -s tests -v
      - run: |
          .venv/bin/python -m playground export --output /tmp/catalog-a.json
          .venv/bin/python -m playground export --output /tmp/catalog-b.json
          cmp /tmp/catalog-a.json /tmp/catalog-b.json

  legacy-presentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-legacy-verification.txt
      - run: python -m venv .venv-legacy
      - run: .venv-legacy/bin/python -m pip install -r requirements-legacy-verification.txt
      - run: .venv-legacy/bin/python -m unittest discover -s tests -p 'test_legacy*.py' -v
